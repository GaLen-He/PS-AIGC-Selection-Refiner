<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="src/main.js"></script>
  </head>
  <body>
    <main class="panel">
      <header>
        <h1>AIGC 选区细化</h1>
        <p>先在 PS 里框选区域，再输入提示词提交。</p>
      </header>

      <section class="card">
        <h2>平台对接</h2>

        <label>
          生成接口 URL
          <input id="generateEndpoint" type="url" placeholder="https://your-company.com/api/generate" />
        </label>

        <label>
          配置接口 URL
          <input id="configEndpoint" type="url" placeholder="https://your-company.com/api/config" />
        </label>

        <label>
          API Key / Token
          <input id="apiKey" type="password" placeholder="可选；会以 Bearer Token 发送" />
        </label>

        <div class="buttonRow">
          <button id="loadConfigButton" class="secondary">读取平台配置</button>
          <button id="saveButton" class="secondary">保存接口设置</button>
        </div>
      </section>

      <section class="card">
        <h2>模型配置</h2>

        <label>
          模型
          <select id="modelSelect">
            <option value="">请先读取平台配置</option>
          </select>
        </label>

        <p id="modelDescription" class="muted">点击“读取平台配置”后显示模型。</p>
        <div id="parametersPanel" class="parameters"></div>
      </section>

      <label>
        提示词
        <textarea id="prompt" rows="6" placeholder="例如：增强这块布料细节，保持原图光影和边缘自然"></textarea>
      </label>

      <button id="submitButton">提交选区生成</button>

      <section class="hint">
        <strong>插件职责：</strong>只负责采集 PS 选区、调用公司平台、把平台返回图放回选区。
        <br />
        <strong>平台配置格式：</strong><code>{ "models": [{ "id": "detail-v2", "name": "Detail V2", "parameters": [] }] }</code>
        <br />
        <strong>生成返回格式：</strong>
        <code>{ "imageBase64": "..." }</code> 或 <code>{ "imageUrl": "https://.../result.png" }</code>
      </section>

      <pre id="status">准备就绪</pre>
    </main>
  </body>
</html>
